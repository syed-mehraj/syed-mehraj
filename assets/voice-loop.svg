<svg xmlns="http://www.w3.org/2000/svg" width="880" height="270" viewBox="0 0 880 270" role="img" aria-label="A live voice call: caller, speech to text, LLM with tools, text to speech, reply">
<title>A live voice call: caller, speech to text, LLM with tools, text to speech, reply</title>
<style>
  .flow { animation: flow 1.2s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -16 } }
  .loop { animation: flow 2.4s linear infinite; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
</style>
<defs>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10"/></filter>
  <filter id="dot" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="1.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <linearGradient id="pb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#0a0f1f"/></linearGradient>
</defs>
<rect x=".5" y=".5" width="879" height="269" rx="16" fill="url(#pb)" stroke="#ffffff" stroke-opacity=".07"/>
<text x="24" y="34" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#64748b">// one turn of a live voice call — what I work on every day</text>
